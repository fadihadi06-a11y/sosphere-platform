apply plugin: 'com.android.application'

// ═══════════════════════════════════════════════════════════════════════════
// FIX 2026-04-24 (Point 7): release signing so Realme/Xiaomi/Huawei devices
// unlock biometric fingerprint.
// ─────────────────────────────────────────────────────────────────────────
// Debug-keystore builds are treated as "untrusted" by ColorOS (Realme/OPPO),
// MIUI (Xiaomi), and HarmonyOS (Huawei) — their biometric subsystems refuse
// to bind fingerprint to an unsigned-with-release-key app, falling back to
// device-credential only (the "PIN twice" UX we saw in the logs). A proper
// release signing keystore fixes this on every affected OEM in one shot.
//
// Keystore loading strategy (defence in depth, prioritise env for CI):
//   1. Environment vars SOSPHERE_KEYSTORE_PATH / _PASSWORD / _ALIAS /
//      _KEY_PASSWORD — GitHub Actions / CI path.
//   2. keystore.properties in android/app/  — local dev (user-managed,
//      gitignored).
//   3. Neither present → release build produces an UNSIGNED APK with a
//      loud warning, debug keys otherwise. Never silently falls back.
//
// The helper script `scripts/release-signing.sh` walks the user through
// generating the keystore on their own machine (private key never leaves
// the user's computer, never committed to git).
// ═══════════════════════════════════════════════════════════════════════════
def loadReleaseSigningConfig() {
    def props = new Properties()

    // Env vars take priority (CI path)
    def envPath = System.getenv("SOSPHERE_KEYSTORE_PATH")
    if (envPath && file(envPath).exists()) {
        return [
            source: "env",
            storeFile: file(envPath),
            storePassword: System.getenv("SOSPHERE_KEYSTORE_PASSWORD") ?: "",
            keyAlias: System.getenv("SOSPHERE_KEYSTORE_ALIAS") ?: "sosphere",
            keyPassword: System.getenv("SOSPHERE_KEYSTORE_KEY_PASSWORD")
                        ?: System.getenv("SOSPHERE_KEYSTORE_PASSWORD") ?: "",
        ]
    }

    // Local keystore.properties
    def propsFile = rootProject.file("app/keystore.properties")
    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
        def storeFilePath = props.getProperty("storeFile")
        if (storeFilePath) {
            def storeFile = new File(storeFilePath)
            if (!storeFile.isAbsolute()) storeFile = rootProject.file("app/${storeFilePath}")
            if (storeFile.exists()) {
                return [
                    source: "keystore.properties",
                    storeFile: storeFile,
                    storePassword: props.getProperty("storePassword") ?: "",
                    keyAlias: props.getProperty("keyAlias") ?: "sosphere",
                    keyPassword: props.getProperty("keyPassword")
                                ?: props.getProperty("storePassword") ?: "",
                ]
            }
        }
    }

    return null
}

def releaseSigning = loadReleaseSigningConfig()
if (releaseSigning != null) {
    logger.lifecycle("[SOSphere] Release signing: using ${releaseSigning.source} → ${releaseSigning.storeFile.name}")
} else {
    logger.warn("[SOSphere] Release signing NOT configured. Release builds will be unsigned. Run scripts/release-signing.sh to generate a keystore.")
}

// R-16 (2026-05-15): APK versioning from CI env vars (resolved once,
// referenced inside android.defaultConfig). Java-style construction avoids
// the Groovy-DSL parsing ambiguity of `versionCode (expr).toInteger()`.
def __apkVersionCode = Integer.parseInt(System.getenv("APK_VERSION_CODE") ?: "1")
def __apkVersionName = System.getenv("APK_VERSION_NAME") ?: "1.0"
logger.lifecycle("[SOSphere] APK versionCode=${__apkVersionCode} versionName=${__apkVersionName}")

android {
    namespace = "com.sosphere.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sosphere.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // R-16 (2026-05-15): versionCode + versionName read from CI env vars
        // (see __apkVersionCode / __apkVersionName resolution at top of file).
        // Before R-16, both were hardcoded → every APK CI built had versionCode 1.
        versionCode __apkVersionCode
        versionName __apkVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile     releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias      releaseSigning.keyAlias
                keyPassword   releaseSigning.keyPassword
                // v2 (APK Signature Scheme) is mandatory on Android 7+
                // and fixes a wide range of OEM biometric bind failures.
                // v3 enables key rotation for future certificate rollover.
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ═══════════════════════════════════════════════════════════════════════════
// Task #31 (2026-05-27) — Firebase API Key Restriction Check
// ─────────────────────────────────────────────────────────────────────────
// The Firebase API key in google-services.json ships unrestricted
// (configuration_version: "1"). This allows:
//   • Quota theft — anyone with the key can burn Firebase quotas
//   • API abuse — FCM, Firestore, Auth calls under our project
//
// HOW TO RESTRICT (Google Cloud Console):
//   1. Go to https://console.cloud.google.com/apis/credentials
//   2. Select project: sosphere-809bb
//   3. Find the API key listed in google-services.json (do NOT paste it here)
//   4. Under "Application restrictions":
//      → Select "Android apps"
//      → Add item:
//           Package name: com.sosphere.app
//           SHA-1 fingerprint: (run ./gradlew signingReport to get it)
//   5. Under "API restrictions":
//      → Select "Restrict key"
//      → Allow only: Firebase Cloud Messaging API, Firebase Installations API,
//        Firebase Dynamic Links API, Token Service API
//   6. Save
//
// To get your SHA-1 fingerprint:
//   ./gradlew signingReport | grep SHA1
//
// After restricting, update google-services.json with the new key if
// Google generates a separate restricted key, or verify the existing key
// now has restrictions applied.
// ═══════════════════════════════════════════════════════════════════════════
tasks.register('checkFirebaseKeyRestriction') {
    group = 'Verification'
    description = 'Warns if Firebase API key appears unrestricted'
    doLast {
        def gsFile = file('google-services.json')
        if (gsFile.exists()) {
            def content = gsFile.text
            // configuration_version "1" typically means no restrictions
            if (content.contains('"configuration_version": "1"')) {
                logger.warn("")
                logger.warn("╔══════════════════════════════════════════════════════════╗")
                logger.warn("║  ⚠ SECURITY: Firebase API key appears UNRESTRICTED      ║")
                logger.warn("║  Apply Android app + API restrictions in Cloud Console.  ║")
                logger.warn("║  See build.gradle Task #31 comment for instructions.     ║")
                logger.warn("╚══════════════════════════════════════════════════════════╝")
                logger.warn("")
            }
        }
    }
}

// Run the check automatically before each build
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn 'checkFirebaseKeyRestriction'
    }
}
