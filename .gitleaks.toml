# ════════════════════════════════════════════════════════════════════════
# Gitleaks configuration — Lighthouse Layer 2 (deep secret scan)
# ────────────────────────────────────────────────────────────────────
# This file is read automatically by gitleaks-action and by `gitleaks
# detect` runs locally. It extends the default rule pack and declares
# a narrow allowlist for deliberate test fixtures + the rotation
# runbook, which legitimately reference secret-format prefixes for
# documentation purposes.
#
# Doctrine: PHASE_0_DOCTRINE.md §2 (Lighthouse L2).
# Added in P0-Z2 because the test fixtures in
# scripts/__behavior_tests__/secret-guard.spec.mjs construct realistic
# pattern matches at runtime (via array.join('')); some fragments still
# pass gitleaks's high-entropy generic-secret rule even though no
# contiguous literal exists in source. The allowlist below is the
# minimal scope needed to make CI green without weakening the actual
# secret-detection signal.
# ════════════════════════════════════════════════════════════════════════

title = "SOSphere gitleaks config (P0-Z2)"

# ─── Extend default ruleset ─────────────────────────────────────────────
# We keep every default rule (AWS, GitHub PAT, Stripe, Twilio, Slack,
# JWT, generic-api-key, etc.) and only add allowlist exceptions.
[extend]
useDefault = true

# ─── Global allowlist ───────────────────────────────────────────────────
# Files listed here are completely excluded from scanning.
# Keep this list as SHORT AS POSSIBLE — every entry is a hole in the
# defense surface. Before adding a path, ask: is this path's content
# fundamentally documentation-of-formats (safe) or actual config (risky)?
[allowlist]
description = "Test fixtures + pattern documentation that intentionally reference secret formats"

paths = [
  # P0-Z2 contract test: builds match-shaped strings at runtime via
  # array.join('') / string concatenation. No literal secret appears
  # contiguously in source, but generic-api-key may flag long fragments.
  '''^scripts/__behavior_tests__/secret-guard\.spec\.mjs$''',

  # P0-Z2 rotation runbook: documents secret prefixes (sk_live_, sbp_,
  # ghp_, etc.) as part of explaining what to rotate. The references
  # are bare prefixes followed by ellipsis or markdown formatting; no
  # real secret is present.
  '''^docs/runbooks/secret-rotation\.md$''',

  # The .env example template: placeholder-only by contract, verified
  # universally by secret-guard.spec.mjs every run. Allowlisted here
  # to prevent generic-api-key false-positives on the longer placeholder
  # strings (e.g. firebase appId placeholder).
  '''^\.env\.example$''',

  # R-55 (2026-05-19): FCM service-account uploader. Line 88 contains the
  # PEM header literal "-----BEGIN PRIVATE KEY-----" as a sanity check on
  # the user's downloaded JSON. The string is a format check, not a key.
  '''^scripts/upload-fcm-service-account\.ps1$''',

  # G-17 HMAC test: takes the HMAC `secret` as a function argument
  # (line 12-18). No hardcoded secret literal — the test wires its own.
  '''^scripts/test-g17-bridge-twiml-gtok\.mjs$''',

  # 2026-05-29 rotation reference docs: list redacted leaked-key
  # placeholders (***REDACTED***) and the new keys' format hints.
  '''^FIREBASE_KEY_ROTATION\.md$''',
  '''^GIT_HISTORY_CLEANUP\.md$''',
  '''^scripts/secrets-to-redact\.txt$''',
  '''^scripts/clean-git-history\.ps1$''',

  # 2026-05-30 (P0-Z3): src/imports/ technical specs — DELETED from main
  # in commit 5f9ab1d ("chore: remove dead src/imports/ directory") but
  # still present in git history. Gitleaks deep-history scan flagged 18
  # findings here; every one is a documentation PLACEHOLDER, verified by
  # reading the source: `XYZ123ABC456[DEF789]` is the literal example
  # token reused across the API-shape docs, and `YOUR_ANON_KEY` /
  # `YOUR_JWT_TOKEN` are placeholder uppercase tokens in curl examples.
  # No real secret ever existed in these files. Allowlisted by path
  # (not history-rewritten) because filter-repo cost outweighs the
  # benefit when zero credentials are real.
  '''^src/imports/TECHNICAL_SPEC_DEEP_LINKING\.md$''',
  '''^src/imports/README_DEVELOPER\.md$''',
]

# Per-rule allowlists — preferred over whole-file when the false-positive
# is one well-known string pattern, not the whole file's contents.
[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = "Test fixtures + Firebase public-by-design client keys. The Firebase keys are also allowlisted under gcp-api-key (their natural rule); they need a duplicate entry here because generic-api-key matches anything high-entropy with an 'apiKey'/'key' label nearby, regardless of the GCP prefix."
  regexes = [
    # Fake Supabase-style UUID used across the trigger-userid test cases.
    '''7c2d1a9f-0b12-4e3d-8a77-5ab93f0ec111''',
    # Rate-limiter test seed (synthetic value, not a real key).
    '''rate-limiter[_-]?test[_-]?seed''',
    # Firebase Android FCM key — public-by-design, see gcp-api-key block
    # above for full rationale + restrictions. Duplicated here because
    # generic-api-key fires independently on high-entropy values.
    '''AIzaSyCYZOp0r7H-0hch3F4NlIgBHRAvGwzrGGc''',
    # Firebase Web/SW key — same reasoning as Android key above.
    '''AIzaSyC5bZLpRf_uXZmbn-eIzxKVsncKZM4KzWI''',
    # i18n (Arabic/English) translation-key references — values shaped like
    # dotted identifiers (e.g. "pp.lifecycle_trial_start_phase",
    # "ana.cost_comparison", "empdt.shift.mar10"). The generic-api-key rule
    # flags them because they sit next to a *Key: label and clear its
    # entropy floor. They are UI string KEYS, never credentials. A real API
    # key is random base64/hex — never a human-readable dotted identifier —
    # so excluding this exact shape does NOT weaken real secret detection.
    '''^[a-z][a-zA-Z0-9_]*(\.[a-zA-Z0-9_]+)+$''',
  ]
  paths = [
    '''^src/app/components/__tests__/sos-server-trigger-userid\.test\.ts$''',
    '''^src/app/components/__tests__/rate-limiter\.test\.ts$''',
    # Central i18n translation dictionary — thousands of en/ar UI strings
    # and dotted keys packed on two lines. Pure presentation data; the
    # generic-api-key rule false-positives on high-entropy value fragments.
    # No credentials live here by contract.
    '''^src/app/components/dashboard-i18n\.tsx$''',
  ]

# ─── gcp-api-key: Firebase client keys are PUBLIC-BY-DESIGN ─────────────
# Firebase Browser + Android API keys (the AIzaSy... prefix) are not
# secrets — they're project identifiers that MUST ship in client code so
# the SDK can talk to Google's servers. Access control comes from:
#   • HTTP referrer restrictions in GCP Console → API & Services →
#     Credentials → Browser key (sosphere.app + localhost only).
#   • Android SHA-1 + package-name restrictions on the Android key.
#   • Firebase Security Rules on every collection.
#
# Reference (Firebase docs):
#   https://firebase.google.com/docs/projects/api-keys
#   "Unlike how API keys are typically used, API keys for Firebase
#    services are not used to control access to backend resources;
#    that can only be done with Firebase Security Rules."
#
# We allowlist the SPECIFIC current key VALUES (not the file paths) so
# that if a future commit accidentally introduces a DIFFERENT
# AIzaSy... key — e.g. a service-account key, or a key for a different
# project that lacks our restrictions — gitleaks still catches it.
#
# Rotation history:
#   • 2026-04 → 2026-05-29: original keys (AIzaSyAw... / AIzaSyDk...)
#     were leaked publicly. ROTATED + restricted + history cleaned.
#   • 2026-05-29 →           : current keys below (AIzaSyCY... / AIzaSyC5...)
#     are the post-rotation values, restricted from day one.
[[rules]]
id = "gcp-api-key"

  [rules.allowlist]
  description = "Firebase Browser + Android API keys — public-by-design per Firebase architecture; secured by HTTP-referrer + SHA-1 restrictions in GCP, not by secrecy."
  regexes = [
    # Android FCM key (google-services.json) — restricted to package
    # com.sosphere.app + production SHA-1 fingerprint in GCP Console.
    '''AIzaSyCYZOp0r7H-0hch3F4NlIgBHRAvGwzrGGc''',
    # Web/SW key (firebase-messaging-sw.js) — restricted to HTTP
    # referrers sosphere.app, *.sosphere.app, localhost in GCP Console.
    '''AIzaSyC5bZLpRf_uXZmbn-eIzxKVsncKZM4KzWI''',
  ]

# Future entries land in either the section above (whole-file exclusion)
# or as per-rule overrides in [[rules.allowlist]] blocks below. Prefer
# per-rule when possible to keep the surface minimal.
