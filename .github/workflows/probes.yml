name: SOSphere Probes — Continuous Telephony Health

# ═══════════════════════════════════════════════════════════════
# SOSphere continuous-monitoring probes. Five jobs across three cadences:
#
# Every 15 minutes (fast-cadence drift detection):
#   1. POST → sos-inbound-probe  → expects pass:true (L2-F inbound SMS)
#   2. POST → twilio-config-probe → expects driftedCount:0 (webhook URLs)
#   3. POST → forgery-probe       → expects pass:true (R-5, L5-SEC-1 defense)
#
# Every 6 hours (heavy-cadence end-to-end):
#   4. POST → sos-dispatch-probe  → expects pass:true (R-4, full SOS path)
#      Uses an intentionally-invalid contact phone so no real Twilio cost.
#      Subject to per-tier SOS rate limits (free=3/day) — 6h cadence safe.
#
# Every push + every 6 hours (deployment drift detection):
#   5. node scripts/check-function-drift.mjs  (R-6)
#      Pulls each deployed edge function's source via the Supabase Management
#      API and compares the SHA-256 of normalized source against the local
#      git working copy. Catches: deploy-forgot, hot-fix-in-Studio-only,
#      deploy-from-wrong-repo. Allowlist in supabase/functions/.deploy-drift-allowlist.json.
#
# A non-pass / drift fails the workflow run. GitHub emails repo admins
# on failure by default (Settings → Notifications). For Slack/Discord/
# PagerDuty, add a webhook step below.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPA_FN_URL              e.g. https://rtfhkbskgrasamhjraul.functions.supabase.co
#   PROBE_SECRET             the hex secret also set in Supabase env (PROBE_SECRET)
#   SUPABASE_ACCESS_TOKEN    Personal Access Token (R-6 only; create at
#                            https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF     the project ref (R-6 only; e.g. rtfhkbskgrasamhjraul)
#
# Manual trigger: workflow_dispatch — runs ALL five jobs ad-hoc, useful
# after a deploy or schema migration.
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    # Every 15 min — the fast-cadence triplet (inbound, config-drift,
    # forgery). Drift-detection latency goal: if any of these pipelines
    # break, we want to know within ~15 min, not "next time a contact
    # happens to reply during an SOS".
    - cron: "*/15 * * * *"
    # Every 6 hours — the heavyweight end-to-end SOS dispatch probe +
    # the function-drift detector (R-6).
    - cron: "0 */6 * * *"
  # Push triggers ONLY the R-6 function-drift job. The other four
  # probes are filtered out via per-job `if:` conditions that match
  # only on schedule / workflow_dispatch events.
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "scripts/check-function-drift.mjs"
      - ".github/workflows/probes.yml"
  workflow_dispatch:

# Cancel any in-flight run if a newer one starts. Prevents pile-up
# during incidents (probe takes ~3s; a 15-min cron should never
# overlap, but defense-in-depth).
concurrency:
  group: probes
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inbound-probe:
    name: Synthetic inbound-SMS pipeline probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Fast-cadence job: runs on the 15-min schedule + manual dispatch.
    # Skipped on the 6-hour dispatch-probe schedule.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    steps:
      - name: Run probe + assert pass
        env:
          SUPA_FN_URL: ${{ secrets.SUPA_FN_URL }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPA_FN_URL:-}" ] || [ -z "${PROBE_SECRET:-}" ]; then
            echo "::error::Missing SUPA_FN_URL or PROBE_SECRET secret"
            exit 2
          fi
          # -f makes curl exit non-zero on HTTP 4xx/5xx. The probe
          # endpoint itself returns 200 even on probe-FAIL (the report
          # body distinguishes pass/fail), so this catches infra-level
          # errors (auth, network, function-not-deployed).
          response=$(curl -fsSL -X POST \
            "$SUPA_FN_URL/sos-inbound-probe" \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          pass=$(echo "$response" | jq -r '.pass')
          if [ "$pass" != "true" ]; then
            echo "::error::Inbound probe FAILED — pipeline broken"
            echo "$response" | jq .
            exit 1
          fi
          elapsed=$(echo "$response" | jq -r '.elapsedMs')
          echo "::notice::Inbound probe OK — end-to-end ${elapsed}ms"

  config-drift-probe:
    name: Twilio webhook config drift probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    steps:
      - name: Run probe + assert no drift
        env:
          SUPA_FN_URL: ${{ secrets.SUPA_FN_URL }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPA_FN_URL:-}" ] || [ -z "${PROBE_SECRET:-}" ]; then
            echo "::error::Missing SUPA_FN_URL or PROBE_SECRET secret"
            exit 2
          fi
          response=$(curl -fsSL -X POST \
            "$SUPA_FN_URL/twilio-config-probe" \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          drifted=$(echo "$response" | jq -r '.driftedCount')
          if [ "$drifted" != "0" ]; then
            echo "::error::Twilio config DRIFT detected — $drifted entities affected"
            echo "$response" | jq '.phones[] | select(.issues | length > 0)'
            echo "$response" | jq '.services[] | select(.issues | length > 0)'
            exit 1
          fi
          total=$(echo "$response" | jq -r '.total')
          echo "::notice::Config-drift probe OK — $total entities clean"

  forgery-probe:
    name: Audit forgery defense probe (R-5)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    steps:
      - name: Run forgery probe + assert L5-SEC-1 defense fired
        env:
          SUPA_FN_URL: ${{ secrets.SUPA_FN_URL }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPA_FN_URL:-}" ] || [ -z "${PROBE_SECRET:-}" ]; then
            echo "::error::Missing SUPA_FN_URL or PROBE_SECRET secret"
            exit 2
          fi
          # R-5: probe attempts a real authenticated forgery against
          # log_sos_audit. If L5-SEC-1 ever regresses, the forged actor
          # would land in the audit chain and this assertion would
          # catch it within 15 minutes.
          # Note: forgery-probe returns HTTP 500 on pass:false so curl -f
          # already exits non-zero in that case. We still parse the body
          # to surface the failure detail in the action log.
          response=$(curl -fsSL -X POST \
            "$SUPA_FN_URL/forgery-probe" \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          pass=$(echo "$response" | jq -r '.pass')
          if [ "$pass" != "true" ]; then
            echo "::error::Forgery probe FAILED — L5-SEC-1 audit-forgery defense NOT firing"
            echo "$response" | jq '.asserts'
            exit 1
          fi
          echo "::notice::Forgery probe OK — L5-SEC-1 defense fired (forged actor overridden with auth.uid())"

  dispatch-probe:
    name: End-to-end SOS orchestration probe (R-4)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Heavy-cadence job: only runs on the 6-hour schedule + manual dispatch.
    # Triggers a real sos-alert call (with an invalid contact phone so no
    # Twilio cost) and is subject to the per-tier SOS rate limit (free=3/day,
    # basic=15/day, elite=30/day). 6h = 4 runs/day stays under the free cap.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    steps:
      - name: Run end-to-end SOS dispatch probe + assert orchestration intact
        env:
          SUPA_FN_URL: ${{ secrets.SUPA_FN_URL }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPA_FN_URL:-}" ] || [ -z "${PROBE_SECRET:-}" ]; then
            echo "::error::Missing SUPA_FN_URL or PROBE_SECRET secret"
            exit 2
          fi
          # R-4: probe triggers a synthetic SOS using an intentionally
          # invalid E.164 phone so no real Twilio API call fires. It then
          # asserts every layer of the orchestration is wired: sos_sessions,
          # sos_dispatch_attempts, audit_log (trigger + end). HTTP 500 on
          # pass:false so curl -f already exits non-zero. Rate-limited
          # responses come back as pass:true with rate_limited:true so we
          # don't false-alarm on cadence collisions.
          response=$(curl -fsSL -X POST \
            "$SUPA_FN_URL/sos-dispatch-probe" \
            -H "Authorization: Bearer $PROBE_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          pass=$(echo "$response" | jq -r '.pass')
          rate_limited=$(echo "$response" | jq -r '.rate_limited // false')
          if [ "$pass" != "true" ]; then
            echo "::error::Dispatch probe FAILED — end-to-end SOS orchestration broken"
            echo "$response" | jq '.asserts'
            exit 1
          fi
          if [ "$rate_limited" = "true" ]; then
            echo "::notice::Dispatch probe rate-limited (cadence collision, not a regression)"
          else
            echo "::notice::Dispatch probe OK — full SOS orchestration verified end-to-end"
          fi

  function-drift-probe:
    name: Deployed-vs-git function drift probe (R-6)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on:
    #   - every push (PR + main)        — instant feedback when a deploy diverges
    #   - the 6-hour heavy cadence      — catches drift introduced via Studio UI
    #     hot-fixes that bypass git entirely
    # Does NOT run on the 15-min cadence — Supabase Management API rate limits
    # apply and the signal is the same for an extra 4x more requests.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '0 */6 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install @deno/eszip (only — full install is unnecessary)
        # The drift script needs @deno/eszip to decode the binary ESZIP bundle
        # returned by Supabase's /v1/projects/{ref}/functions/{slug}/body
        # endpoint. We don't need the rest of the dev dependencies here — a
        # targeted install keeps the job lean (~30s vs ~3m for full npm ci).
        run: npm install --no-save --no-audit --no-fund @deno/eszip@^0.106.0

      - name: Run function-drift detector
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secret"
            echo "::error::Create a PAT at https://supabase.com/dashboard/account/tokens"
            exit 2
          fi
          # R-6: exits 1 on drift / non-allowlisted orphan. The script prints
          # a structured report so the failure message in the GHA log tells
          # you exactly which function diverged and by how many lines.
          node scripts/check-function-drift.mjs
