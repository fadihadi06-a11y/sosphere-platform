name: SOSphere CI — Lint, Audit & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Security Audit ──────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical --omit=dev

  # ── Job 2: ESLint ──────────────────────────────────────
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O-M1: intermediate cap of 1100 warnings (long-term goal <100)
      - run: npx eslint src/app/ --max-warnings 1100

  # ── Job 3: Vitest Test Suite ───────────────────────────
  # FOUNDATION-3: every push runs the full test suite. ~32 tests
  # cover risk scoring, audit-log RLS, civilian trial server,
  # consent migration, complete logout, AUTH-5 architectural
  # invariants, L1-A observability, and more.
  test:
    name: Vitest Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # ── Job 4: Migration Drift Guard ───────────────────────
  # L0.5 (#182): catches migrations applied to live Supabase that never
  # made it to git. Lock file is the single source of truth for
  # "what migrations git knows about" — see scripts/check-migration-drift.mjs
  migration-drift:
    name: Migration Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-migration-drift.mjs --check

  # ── Job 5: Vite Build ──────────────────────────────────
  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O-M4: write secrets to .env in a single masked step instead of
      # exposing them as step-level env vars (reduces surface for log leakage)
      - name: Create .env (secrets)
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
        shell: bash
      - run: npx vite build
