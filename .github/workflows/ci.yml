name: SOSphere CI — Lint, Audit & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Security Audit ──────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical --omit=dev

  # ── Job 2: ESLint ──────────────────────────────────────
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # O-M1: intermediate cap of 300 warnings (long-term goal <100)
      - run: npx eslint src/app/ --max-warnings 1100

  # ── Job 3: Vitest Test Suite ───────────────────────────
  # FOUNDATION-3: every push runs the full test suite. ~32 tests
  # cover risk scoring, audit-log RLS, civilian trial server,
  # consent migration, complete logout, AUTH-5 architectural
  # invariants, and more. Catches regressions before production.
  test:
    name: Vitest Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # ── Job 4: Migration Drift Guard ───────────────────────
  # L0.5 (#182): catches migrations applied to live Supabase that never
  # made it to git. Before this guard, foundation_canonical_identity_rpc
  # lived only in production for ~24h. Lock file is the single source of
  # truth for "what migrations git knows about" — see scripts/check-migration-drift.mjs
  migration-drift:
    name: Migration Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-migration-drift.mjs --check

  # ── Job 4: Build ───────────────────────────────────────
  build:
    name: Vite Build