name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI on any branch
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      # R-16 (2026-05-15): write ALL configured secrets to .env in a single
      # masked step. Optional secrets are emitted only if present (empty
      # values would still result in `import.meta.env.X === ""`, breaking
      # env-shield-v2 detection). Same pattern as ci.yml's masked step.
      - name: Create .env file from secrets
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            # Optional — emitted only when set, so env-shield-v2 sees absence
            # vs empty correctly. Use bash `[[ -n ]]` (de-referencing the
            # secret to a variable first is necessary because secret access
            # in `if:` expressions is restricted).
            VITE_GOOGLE_CLIENT_ID='${{ secrets.VITE_GOOGLE_CLIENT_ID }}'
            VITE_FIREBASE_API_KEY='${{ secrets.VITE_FIREBASE_API_KEY }}'
            VITE_FIREBASE_AUTH_DOMAIN='${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}'
            VITE_FIREBASE_PROJECT_ID='${{ secrets.VITE_FIREBASE_PROJECT_ID }}'
            VITE_FIREBASE_MESSAGING_SENDER_ID='${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}'
            VITE_FIREBASE_APP_ID='${{ secrets.VITE_FIREBASE_APP_ID }}'
            VITE_FIREBASE_VAPID_KEY='${{ secrets.VITE_FIREBASE_VAPID_KEY }}'
            VITE_SENTRY_DSN='${{ secrets.VITE_SENTRY_DSN }}'
            [[ -n "$VITE_GOOGLE_CLIENT_ID" ]]          && echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
            [[ -n "$VITE_FIREBASE_API_KEY" ]]          && echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"
            [[ -n "$VITE_FIREBASE_AUTH_DOMAIN" ]]      && echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN"
            [[ -n "$VITE_FIREBASE_PROJECT_ID" ]]       && echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID"
            [[ -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" ]] && echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID"
            [[ -n "$VITE_FIREBASE_APP_ID" ]]           && echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"
            [[ -n "$VITE_FIREBASE_VAPID_KEY" ]]        && echo "VITE_FIREBASE_VAPID_KEY=$VITE_FIREBASE_VAPID_KEY"
            [[ -n "$VITE_SENTRY_DSN" ]]                && echo "VITE_SENTRY_DSN=$VITE_SENTRY_DSN"
            # Always-set context vars
            echo "VITE_ENVIRONMENT=production"
            echo "VITE_APP_VERSION=${{ github.sha }}"
          } >> .env
        shell: bash

      # R-16: capacitor.config.json substitution. The serverClientId for
      # GoogleAuth was previously hardcoded; this allows per-environment
      # OAuth clients (dev/staging/prod) via GitHub secret.
      - name: Substitute GoogleAuth serverClientId in capacitor.config.json
        if: ${{ env.GOOGLE_SERVER_CLIENT_ID != '' }}
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            if (cfg.plugins && cfg.plugins.GoogleAuth) {
              cfg.plugins.GoogleAuth.serverClientId = process.env.GOOGLE_SERVER_CLIENT_ID;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('[R-16] capacitor.config.json serverClientId substituted from env.');
            } else {
              console.log('[R-16] capacitor.config.json has no GoogleAuth plugin — skipping.');
            }
          "
        shell: bash

      - name: Build web bundle (vite)
        run: npx vite build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Decode the release keystore from a base64 secret so assembleRelease
      # produces a SIGNED APK (required for native Google Sign-In: Google
      # validates the app by package + the registered SHA-1 of this key).
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — add it (base64 of android/app/sosphere-release.jks) to build a signed APK."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sosphere-release.jks"
          echo "SOSPHERE_KEYSTORE_PATH=$RUNNER_TEMP/sosphere-release.jks" >> "$GITHUB_ENV"
          echo "[keystore] decoded $(wc -c < "$RUNNER_TEMP/sosphere-release.jks") bytes"
        shell: bash

      # R-16: pass GITHUB_RUN_NUMBER → APK_VERSION_CODE so every CI build
      # has a monotonic versionCode. Android refuses to install a new APK
      # with a versionCode <= the installed APK without explicit uninstall.
      - name: Build signed release APK
        working-directory: android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: "1.0.${{ github.run_number }}"
          SOSPHERE_KEYSTORE_PASSWORD: ${{ secrets.SOSPHERE_KEYSTORE_PASSWORD }}
          SOSPHERE_KEYSTORE_KEY_PASSWORD: ${{ secrets.SOSPHERE_KEYSTORE_KEY_PASSWORD }}
          SOSPHERE_KEYSTORE_ALIAS: sosphere
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with commit SHA
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk \
             apk-output/sosphere-release-${{ github.sha }}.apk
          # Also create a stable "latest" filename
          cp android/app/build/outputs/apk/release/app-release.apk \
             apk-output/sosphere-release-latest.apk
          ls -lh apk-output/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sosphere-release-apk-${{ github.sha }}
          path: apk-output/sosphere-release-*.apk
          retention-days: 30
          if-no-files-found: error

      # Only attach to a Release when running on a tag or manual dispatch
      - name: Create GitHub Release (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Signed Release APK — build ${{ github.run_number }}
          body: |
            Automated signed release APK build.

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Built:** ${{ github.event.head_commit.timestamp }}
            **versionCode:** ${{ github.run_number }}
            **versionName:** 1.0.${{ github.run_number }}

            Download `sosphere-release-latest.apk` below and install on your phone.
            On Android: enable "Install unknown apps" for your file manager, then tap the APK.
          files: apk-output/sosphere-release-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
