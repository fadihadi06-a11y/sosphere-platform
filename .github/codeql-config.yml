name: SOSphere CodeQL config

# ──────────────────────────────────────────────────────────────────────
# Excludes paths that shouldn't be scanned (vendor / generated / mock
# data / fixtures) so the security alerts stay focused on real source.
# ──────────────────────────────────────────────────────────────────────

paths-ignore:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "coverage/**"
  - "android/app/build/**"
  - "android/build/**"
  - "ios/App/build/**"
  - "**/*.d.ts"
  - "src/imports/**"           # ReactBits / Tailwind UI vendor files
  - "supabase/migrations/**"   # SQL migrations — not in CodeQL JS scope
  - "scripts/build/**"         # Build scripts, not user-facing
  - "**/__tests__/**/fixtures/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.test.tsx"
  - "**/*.spec.tsx"

# Limit total analysis size — prevents runaway scans on huge generated
# bundles. CodeQL skips files above this threshold.
paths:
  - "src/**"
  - "supabase/functions/**"

# Disable specific queries that surface lots of false positives in our
# stack (notably: useless-conditional warnings on intentional ?. chains,
# and the "incorrect comparison against undefined" rule that flags every
# defensive `x === undefined` we use for clarity).
query-filters:
  - exclude:
      id: js/useless-conditional
  - exclude:
      id: js/incomplete-multi-character-sanitization
  - exclude:
      # Vite's import.meta.env access pattern triggers this; intentional.
      id: js/import-meta-environment-info-leak
  - exclude:
      # ──────────────────────────────────────────────────────────────────
      # B1 (2026-05-26): by-design exemption — clear-text storage in
      # localStorage is the documented offline-first architecture choice.
      # The SOSphere platform stores employee status, broadcasts, audit
      # log, evacuation state, etc. in localStorage on the user's OWN
      # device. The data never leaves the device unencrypted (Realtime
      # broadcasts go over Supabase TLS). The CodeQL rule treats every
      # localStorage.setItem with employee-shaped data as sensitive
      # storage — but in our threat model, the localStorage IS the
      # legitimate destination (the worker's own phone or admin's own
      # laptop), not an exfiltration sink.
      #
      # Migration path (deferred PR — Task #73): add an AES-GCM
      # encryption layer in safeSetItem so the localStorage values are
      # encrypted with a device-bound key. When that PR lands, this
      # exclude can be removed and the rule re-enabled platform-wide.
      #
      # See: docs/SECURITY_BY_DESIGN_LOCALSTORAGE.md
      # ──────────────────────────────────────────────────────────────────
      id: js/clear-text-storage-of-sensitive-data
