[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"

[functions.sos-alert]
verify_jwt = false

[functions.sos-bridge-twiml]
verify_jwt = false

[functions.twilio-call]
verify_jwt = false

[functions.twilio-sms]
verify_jwt = false

[functions.twilio-status]
verify_jwt = false

[functions.twilio-token]
verify_jwt = false

[functions.twilio-twiml]
verify_jwt = false

# L2-F: Twilio inbound-SMS webhook. Twilio sends its own X-Twilio-Signature
# (verified inside the function) — never a Supabase JWT, so the gateway
# JWT check must be disabled or every inbound SMS reply gets 401'd
# before reaching our code.
[functions.sos-sms-inbound]
verify_jwt = false

# L1-D Phase 2: drift probe authenticated by PROBE_SECRET bearer token
# (constant-time compared inside the function). Same pattern as Twilio
# webhooks — gateway must step aside.
[functions.twilio-config-probe]
verify_jwt = false

# L1-D Phase 3: synthetic inbound-SMS probe — authenticated by
# PROBE_SECRET bearer token (constant-time compared inside the
# function). Same pattern as twilio-config-probe.
[functions.sos-inbound-probe]
verify_jwt = false