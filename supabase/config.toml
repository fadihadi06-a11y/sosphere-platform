[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"

[functions.stripe-webhook]
# R-19 #17 fix (2026-05-15): Stripe webhooks MUST be publicly accessible
# (signed by stripe-signature header, not JWT). Without verify_jwt=false
# the Supabase gateway rejects every Stripe event with 401 before our
# function's signature verification runs. Discovered by the R-19 Phase 5
# self-test probe — would have been a production-blocker on first
# Stripe payment event.
verify_jwt = false

[functions.sos-alert]
verify_jwt = false

[functions.sos-bridge-twiml]
verify_jwt = false

[functions.twilio-call]
verify_jwt = false

[functions.twilio-sms]
verify_jwt = false

[functions.twilio-status]
verify_jwt = false

[functions.twilio-token]
verify_jwt = false

[functions.twilio-twiml]
verify_jwt = false

# L2-F: Twilio inbound-SMS webhook. Twilio sends its own X-Twilio-Signature
# (verified inside the function) — never a Supabase JWT, so the gateway
# JWT check must be disabled or every inbound SMS reply gets 401'd
# before reaching our code.
[functions.sos-sms-inbound]
verify_jwt = false

# L1-D Phase 2: drift probe authenticated by PROBE_SECRET bearer token
# (constant-time compared inside the function). Same pattern as Twilio
# webhooks — gateway must step aside.
[functions.twilio-config-probe]
verify_jwt = false

# L1-D Phase 3: synthetic inbound-SMS probe — authenticated by
# PROBE_SECRET bearer token (constant-time compared inside the
# function). Same pattern as twilio-config-probe.
[functions.sos-inbound-probe]
verify_jwt = false

# R-5: authenticated-forgery PoC for L5-SEC-1. Signs in as a probe
# user, calls log_sos_audit with a forged p_actor, asserts the
# auth.uid() override fired. Bearer-token auth via PROBE_SECRET.
[functions.forgery-probe]
verify_jwt = false

# R-4: end-to-end SOS orchestration probe. Triggers a synthetic SOS
# (using an intentionally-invalid contact phone so no Twilio dispatch
# fires), asserts every layer of the orchestration: sos_sessions,
# sos_dispatch_attempts, audit_log, then ends it and asserts the close-out
# state. Bearer-token auth via PROBE_SECRET.
[functions.sos-dispatch-probe]
verify_jwt = false

# L4-B: public health endpoint - no auth, returns minimal
# pulse JSON. Used by uptime monitors + status pages.
[functions.sos-health]
verify_jwt = false

# R-17: parallel SOS load test probe (workflow_dispatch only, not on cron).
# Bearer-token auth via PROBE_SECRET — same pattern as sos-dispatch-probe.
[functions.sos-load-probe]
verify_jwt = false

# R-19 Phase 5: self-test for stripe-webhook. Bearer-token via PROBE_SECRET.
# Sends signed test events to the deployed stripe-webhook and asserts the 3
# critical paths (valid signature, replay dedup, invalid signature).
[functions.stripe-webhook-test-probe]
verify_jwt = false

# R-19 #18: end-to-end Stripe integration test (creates real Stripe customer
# + subscription via API, verifies webhook → DB write, cleans up). Bearer
# via PROBE_SECRET. workflow_dispatch / manual only.
[functions.stripe-e2e-test-probe]
verify_jwt = false
